<html lang="sv">
<head>

  <style>
    :root {
      --linen: #f4efe6;
      --ink: #1c140e;
      --muted: #6d5c4a;
      --cream: #fffaf3;
      --hair: rgba(28, 20, 14, .12);
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
      --g: 16px;
      --r: 26px;
      --head: 56px;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { background: var(--cream); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html:has(dialog[open]) { overflow: hidden; }
    body { margin: 0; background: var(--cream); color: var(--ink); font: 400 1rem/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
    h1, h2, p, ul { margin: 0; }
    ul { padding: 0; list-style: none; }
    img, video { display: block; }
    button { margin: 0; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .serif {
      font-family: var(--serif); font-optical-sizing: auto; font-weight: 400;
      font-variation-settings: "SOFT" 100, "WONK" 0; font-variant-numeric: lining-nums;
    }
    /* Big names: a lower optical size reads rounder, like soft dough */
    .title, .wide-name, .cost, .wide-cost { font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 36; }
    .wrap { width: 100%; max-width: 1400px; margin-inline: auto; padding-inline: max(var(--g), env(safe-area-inset-left)) max(var(--g), env(safe-area-inset-right)); }
    .pill { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; white-space: nowrap; }

    /* Header */
    .top { position: sticky; top: 0; z-index: 3; background: var(--cream); }
    .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: var(--head); }
    .logo { font-size: 1.3rem; font-weight: 430; letter-spacing: -.015em; line-height: 1; color: var(--ink); text-decoration: none; }
    .bag {
      gap: .4em; height: 42px; padding: 0 16px; background: transparent; color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(28, 20, 14, .28); font-weight: 500; font-size: .92rem;
    }
    .bag span { font-variant-numeric: tabular-nums; }
    .bag:hover { box-shadow: inset 0 0 0 1px var(--ink); }
    .bag[data-full] { background: var(--ink); color: var(--cream); box-shadow: none; }

    /* Stage: film and its label, one cushion */
    .stage { padding-top: 2px; }
    .unit {
      display: grid; width: 100%; margin-inline: auto; overflow: hidden; isolation: isolate;
      max-width: max(260px, calc((100vh - 300px) * .8)); max-width: max(260px, calc((100svh - 300px) * .8));
      border-radius: var(--r); background: var(--ink); color: var(--cream);
    }
    .frame { position: relative; overflow: hidden; aspect-ratio: 4 / 5; background: var(--linen); }
    .frame video, .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #film { object-position: 50% 72%; }
    #still { object-position: 50% 50%; }
    .frame[data-pick="tre"] #still { object-position: 50% 58%; }
    .frame[data-pick="klass"] #still { object-position: 50% 62%; }
    .unit[data-square] .frame { aspect-ratio: 1 / 1; }
    .frame [hidden] { display: none; }
    .frame video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
    .frame video::-webkit-media-controls { display: none !important; }
    .klam {
      position: absolute; left: 14px; bottom: 14px; z-index: 1;
      height: 40px; padding: 0 16px; background: var(--cream); color: var(--ink);
      font-weight: 500; font-size: .9rem; box-shadow: 0 1px 3px rgba(28, 20, 14, .18);
    }
    .klam:hover { background: var(--linen); }

    .label { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: 12px; padding: 18px 20px 20px; }
    .kind, .line, .buy { grid-column: 1 / -1; }
    .kind { font-size: .8rem; letter-spacing: .02em; color: rgba(255, 250, 243, .55); }
    .title { font-size: 1.95rem; line-height: 1; letter-spacing: -.02em; margin-top: 4px; font-weight: 400; }
    .title:focus, #cart-title:focus, .empty:focus { outline: none; }
    .line { margin-top: 6px; font-size: .98rem; color: rgba(255, 250, 243, .74); }
    .head, .buy { display: contents; }
    .cost { grid-row: 2; grid-column: 2; font-size: 1.5rem; line-height: 1; white-space: nowrap; }
    .take {
      grid-column: 1 / -1; width: 100%; height: 54px; margin-top: 16px;
      background: var(--cream); color: var(--ink); font-weight: 500; font-size: 1.05rem;
    }
    .take:hover { background: var(--linen); }
    .label :focus-visible { outline-color: var(--cream); }
    .ship { grid-column: 1 / -1; margin-top: 10px; font-size: .82rem; color: rgba(255, 250, 243, .55); }

    /* Catalogue */
    .shop { padding-top: 44px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 14px; align-items: start; }
    .card { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; border-radius: 22px; }
    .card:focus-visible { outline: none; }
    .card:focus-visible .pic { outline: 2px solid var(--ink); outline-offset: 4px; }
    .pic { display: block; aspect-ratio: 1 / 1; border-radius: 22px; overflow: hidden; background: var(--linen); }
    .pic img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .card:hover .pic { outline: 1px solid rgba(28, 20, 14, .3); outline-offset: 4px; }
    .card[aria-pressed="true"] .pic { outline: 1.5px solid var(--ink); outline-offset: 4px; }
    .cap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .45em; margin-top: 12px; font-size: 1.12rem; line-height: 1.2; }
    .nm { letter-spacing: -.01em; }
    .pr { white-space: nowrap; color: var(--muted); }
    .ln { flex-basis: 100%; margin-top: 3px; font-size: .84rem; line-height: 1.35; color: var(--muted); }

    .wide {
      grid-column: 1 / -1; display: grid; grid-template-columns: calc(50% - 6px) minmax(0, 1fr);
      border-radius: 22px; overflow: hidden; background: var(--ink); color: var(--cream);
    }
    .wide .pic { border-radius: 0; }
    .wide:hover .pic, .wide[aria-pressed="true"] .pic, .wide:focus-visible .pic { outline: none; }
    .wide:hover { outline: 1px solid rgba(28, 20, 14, .3); outline-offset: 4px; }
    .wide[aria-pressed="true"] { outline: 1.5px solid var(--ink); outline-offset: 4px; }
    .wide:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    .wide-text { display: flex; flex-direction: column; padding: 16px 16px 18px; }
    .wide-name { font-size: 1.6rem; line-height: 1; letter-spacing: -.02em; font-weight: 400; }
    .wide-line { margin-top: 6px; font-size: .9rem; line-height: 1.35; color: rgba(255, 250, 243, .74); }
    .wide-text { justify-content: flex-end; }
    .wide-cost { padding-top: 14px; font-size: 1.25rem; line-height: 1; }

    .foot { padding-top: 64px; padding-bottom: calc(36px + env(safe-area-inset-bottom)); color: var(--muted); font-size: .84rem; }

    /* Cart: a bottom sheet for the thumb, a side cushion on desktop */
    .cart {
      position: fixed; inset: auto 0 0 0; margin: 0; padding: 0;
      width: 100%; max-width: none; height: auto; max-height: min(88vh, 640px); max-height: min(88svh, 640px);
      border: 0; border-radius: 26px 26px 0 0; background: var(--cream); color: var(--ink);
    }
    .cart::backdrop { background: rgba(28, 20, 14, .34); }
    .sheet { display: flex; flex-direction: column; height: 100%; max-height: inherit; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px; }
    .sheet-head h2 { font: 500 1.2rem/1 var(--sans); }
    .close { height: 38px; padding: 0 16px; background: var(--linen); font-size: .92rem; font-weight: 500; }
    .close:hover { background: rgba(28, 20, 14, .1); }
    .lines { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px; overscroll-behavior: contain; }
    .row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--hair); }
    .row-pic { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; background: var(--linen); }
    .row-name { display: block; font-size: 1.2rem; line-height: 1.2; letter-spacing: -.01em; }
    .row-cost { display: block; margin-top: 2px; color: var(--muted); }
    .qty { display: flex; align-items: center; gap: 6px; }
    .qty button { width: 44px; height: 44px; padding: 0; background: var(--linen); font-size: 1.15rem; line-height: 1; }
    .qty button:hover { background: rgba(28, 20, 14, .1); }
    .qty output { min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
    .empty { padding: 14px 0 22px; color: var(--muted); }
    .sheet-foot { padding: 16px 20px calc(20px + env(safe-area-inset-bottom)); }
    .sum { display: flex; justify-content: space-between; align-items: baseline; }
    .sum-cost { font-size: 1.6rem; line-height: 1; }
    .note { margin-top: 4px; color: var(--muted); font-size: .86rem; }
    .pay { width: 100%; height: 56px; margin-top: 16px; background: var(--ink); color: var(--cream); font-weight: 500; font-size: 1.05rem; }
    .pay:hover { box-shadow: inset 0 0 0 999px rgba(255, 250, 243, .12); }
    .pay[aria-disabled="true"] { cursor: default; background: rgba(28, 20, 14, .14); color: var(--muted); box-shadow: none; }
    .sheet[data-empty] .sum, .sheet[data-empty] .note { display: none; }
    .sheet[data-empty] .pay { margin-top: 0; }

    @media (forced-colors: active) {
      .pill { border: 1px solid ButtonText; }
    }

    /* Short phones: a square film keeps the label in the first screen at full width */
    @media (max-width: 859px) and (max-height: 720px) and (orientation: portrait) {
      .unit { max-width: max(260px, calc(100vh - 290px)); max-width: max(260px, calc(100svh - 290px)); }
      .frame { aspect-ratio: 1 / 1; }
    }

    /* Tablets and up: roomier header, catalogue and cart */
    @media (min-width: 860px), (min-width: 600px) and (max-height: 520px) and (orientation: landscape) {
      :root { --g: 32px; --r: 34px; --head: 72px; }
      .logo { font-size: 1.6rem; }
      .bag { height: 42px; padding: 0 18px; font-size: .95rem; }
      .stage { padding-top: 4px; }

      .shop { padding-top: 48px; }
      .grid { gap: 72px 40px; }
      .card, .pic { border-radius: var(--r); }
      .card[aria-pressed="true"] .pic, .wide[aria-pressed="true"] { outline-offset: 6px; }
      .cap { margin-top: 20px; font-size: 1.85rem; }
      .nm { letter-spacing: -.02em; font-weight: 380; }
      .pr { font-weight: 360; }
      .ln { margin-top: 8px; font-size: 1.05rem; }
      .wide { grid-template-columns: calc(50% - 20px) minmax(0, 1fr); border-radius: var(--r); }
      .wide-text { padding: 34px 36px 36px; }
      .wide-name { font-size: clamp(2.5rem, 4.2vw, 3.75rem); }
      .wide-line { margin-top: 14px; font-size: 1.1rem; }
      .wide-cost { font-size: 2.1rem; }

      .foot { padding-top: 96px; padding-bottom: 48px; }

      .cart {
        inset: 12px 12px 12px auto; width: min(calc(100% - 24px), 26rem);
        max-height: none; border-radius: var(--r);
      }
      .sheet { max-height: none; }
      .sheet-head { padding: 26px 28px 10px; }
      .lines { padding: 0 28px; }
      .sheet-foot { padding: 20px 28px 28px; }
    }

    /* Tall tablets keep the stacked stage, just larger */
    @media (min-width: 860px) and (max-width: 1099px) and (orientation: portrait) {
      .unit { max-width: calc((100vh - 350px) * .8); max-width: calc((100svh - 350px) * .8); }
      .label { padding: 26px 30px 30px; }
      .title { font-size: 2.6rem; }
      .cost { font-size: 2rem; }
      .line { font-size: 1.1rem; }
      .take { height: 60px; }
    }

    /* Side by side: laptops, landscape tablets, phones on their side.
       The film's height leaves room for the first row of the collection to show,
       and header, film and grid share one width so their edges line up. */
    @media (min-width: 1100px), (min-width: 860px) and (orientation: landscape), (min-width: 600px) and (max-height: 520px) and (orientation: landscape) {
      :root {
        --h: max(420px, calc(100vh - var(--head) - 172px));
        --fw: min(calc(100vw - 2 * var(--g) - 380px), calc(var(--h) * 1.25), 900px);
      }
      .wrap { max-width: min(1400px, calc(var(--fw) + 520px + 2 * var(--g))); }
      .unit { grid-template-columns: var(--fw) minmax(0, 1fr); max-width: none; }
      .frame, .unit[data-square] .frame { aspect-ratio: 5 / 4; }
      .klam { left: 20px; bottom: 20px; height: 40px; padding: 0 18px; font-size: .95rem; }

      .label { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; padding: 34px 36px 36px; }
      .head { margin-bottom: 36px; }
      .kind { font-size: .82rem; }
      .title { font-size: clamp(2.5rem, 4.2vw, 3.75rem); line-height: .98; margin-top: 12px; }
      .line { margin-top: 14px; font-size: 1.1rem; }
      .head { display: block; }
      .buy { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 20px; }
      .cost { grid-row: 1; grid-column: 1; font-size: 2.1rem; }
      .take { grid-column: 2; height: 58px; margin-top: 0; max-width: 300px; }
      .ship { grid-column: 1 / -1; margin-top: 16px; font-size: .86rem; }
    }

    @media (min-width: 1100px) {
      :root { --g: 40px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 60px 32px; }
      .cap { margin-top: 16px; font-size: 1.45rem; }
      .ln { margin-top: 6px; font-size: .98rem; }
      .wide { grid-template-columns: calc((100% - 64px) / 3) minmax(0, 1fr); }
      .wide-text { padding: 36px 40px 38px; }
    }

    /* Phone on its side: tighter, and the film fills the height */
    @media (max-height: 520px) and (min-width: 600px) and (orientation: landscape) {
      :root {
        --head: 56px;
        --h: max(220px, calc(100vh - var(--head) - 28px));
        --fw: min(calc(100vw - 2 * var(--g) - 300px), calc(var(--h) * 1.25));
      }
      .label { padding: 20px 22px 22px; }
      .title { font-size: 2rem; margin-top: 6px; }
      .line { margin-top: 6px; font-size: .95rem; }
      .cost { font-size: 1.5rem; }
      .take { height: 48px; }
      .ship { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo serif" href="/">slinkynsquishy</a>
      <button class="pill bag" id="open" type="button" aria-haspopup="dialog" aria-controls="cart">Korg <span id="count">0</span></button>
    </div>

  <main>

          </div>
          <div class="buy">
            <p class="cost serif" id="price">79 kr</p>

          </div>
        </div>
      </div>
    </section>

    <section class="shop wrap" aria-label="Alla">
      <div class="grid" id="grid">
        <button class="card" type="button" aria-pressed="false" data-id="toast" data-variant="58793534521675" data-price="79" data-img="img/toast.jpg" data-line="Den som ser ut som frukost.">
          <span class="pic"><img src="img/toast.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="cap"><span class="nm serif">Toasten</span><span class="pr serif">79 kr</span><span class="ln">Den som ser ut som frukost.</span></span>
        </button>
        <button class="card" type="button" aria-pressed="false" data-id="mochi" data-variant="58793534882123" data-price="99" data-img="img/mochi.jpg" data-line="Tre som försvinner.">
          <span class="pic"><img src="img/mochi.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="cap"><span class="nm serif">Mochi</span><span class="pr serif">99 kr</span><span class="ln">Tre som försvinner.</span></span>
        </button>
        <button class="card" type="button" aria-pressed="false" data-id="persika" data-variant="58793534816587" data-price="49" data-img="img/persika.jpg" data-line="Liten nog för fickan.">
          <span class="pic"><img src="img/persika.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="cap"><span class="nm serif">Persikan</span><span class="pr serif">49 kr</span><span class="ln">Liten nog för fickan.</span></span>

          <span class="pic"><img src="img/ost.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="cap"><span class="nm serif">Osten</span><span class="pr serif">69 kr</span><span class="ln">Hål att trycka tummen i.</span></span>
        </button>
        <button class="card" type="button" aria-pressed="true" data-id="smor" data-variant="58793534456139" data-price="79" data-img="img/smor.jpg" data-line="Till barnet. Eller till dig.">
          <span class="pic"><img src="img/smor.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="cap"><span class="nm serif">Smöret</span><span class="pr serif">79 kr</span><span class="ln">Till barnet. Eller till dig.</span></span>
        </button>
        <button class="card" type="button" aria-pressed="false" data-id="tre" data-variant="58793535603019" data-price="199" data-img="img/tre.jpg" data-line="Fri frakt.">
          <span class="pic"><img src="img/tre.jpg" alt="" loading="lazy" decoding="async"></span>

  <footer class="foot wrap">
    <p>Säljs av Nytto Labs. Betalning hos Shopify.</p>
  </footer>

  <dialog class="cart" id="cart" aria-labelledby="cart-title">

      <div class="sheet-head">
        <h2 id="cart-title" tabindex="-1">Korg</h2>
        <button class="pill close" id="close" type="button">Stäng</button>
      </div>
      <div class="lines" id="lines"></div>
      <div class="sheet-foot">
        <div class="sum"><span>Summa</span><span class="sum-cost serif" id="sum">0 kr</span></div>
        <p class="note" id="note"></p>
        <button class="pill pay" id="pay" type="button">Betala</button>
      </div>
    </div>
  </dialog>

  <script>
    (() => {
      const SHOP = "https://pqwbeh-yy.myshopify.com/cart/";
      const FREE = 199;
      const SHIPPING = 39;
      const KEY = "slinkynsquishy-korg";
      const $ = (id) => document.getElementById(id);

      const film = $("film");
      const still = $("still");
      const cartDialog = $("cart");
      const cards = [...document.querySelectorAll(".card")];

      const items = {};
      for (const card of cards) {
        const d = card.dataset;
        items[d.id] = {
          name: card.querySelector(".serif").textContent,
          price: Number(d.price),
          line: d.line,
          img: d.img,
          variant: d.variant
        };
      }

      const kr = (n) => n.toLocaleString("sv-SE") + " kr";
      // Photos shot square; on a phone they get a square frame so nothing is cut.
      const SQUARE = ["toast", "ost", "persika", "mochi"];
      let pick = "smor";

      function play() {
        film.currentTime = 0;
        const p = film.play();
        if (p) p.catch(() => {});
      }

      function show(id) {
        const item = items[id];
        if (!item) return;
        const was = pick;
        pick = id;
        $("name").textContent = item.name;
        $("line").textContent = item.line;
        $("price").textContent = kr(item.price);
        for (const card of cards) card.setAttribute("aria-pressed", String(card.dataset.id === id));
        $("frame").dataset.pick = id;
        $("unit").toggleAttribute("data-square", SQUARE.includes(id));
        if (id === "smor") {
          still.hidden = true;
          still.removeAttribute("src");
          film.hidden = false;
          if (was !== "smor" && film.autoplay) play();
        } else {
          film.pause();
          film.hidden = true;
          // Keep the frame empty rather than show the old photo under the new name.
          const thumb = document.querySelector(`.card[data-id="${id}"] img`);
          still.onload = () => { if (pick === id) still.hidden = false; };
          still.src = item.img;
          still.hidden = !(thumb && thumb.complete && thumb.naturalWidth);
        }
      }

      // Cart
      function load() {
        try {
          let raw = localStorage.getItem(KEY);
          if (raw === null) {
            // Betala hands the cart to Shopify; only a Back from there brings it back.
            const nav = performance.getEntriesByType("navigation")[0];
            if (nav && nav.type === "back_forward") raw = sessionStorage.getItem(KEY);
          }
          const saved = JSON.parse(raw || "[]");
          if (Array.isArray(saved)) {
            return saved
              .filter((l) => l && items[l.id] && Number.isInteger(l.qty) && l.qty > 0)
              .map((l) => ({ id: l.id, qty: Math.min(l.qty, 99) }));
          }
        } catch (e) {}
        return [];
      }
      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(cart)); } catch (e) {}
      }

      let cart = load();
      if (cart.length) save();

      function drawCart() {
        const count = cart.reduce((s, l) => s + l.qty, 0);
        const total = cart.reduce((s, l) => s + items[l.id].price * l.qty, 0);
        $("count").textContent = count;
        $("open").toggleAttribute("data-full", count > 0);
        $("lines").innerHTML = cart.length
          ? "<ul>" + cart.map((l) => {
              const item = items[l.id];
              return `<li class="row">
                <img class="row-pic" src="${item.img}" alt="">
                <div><span class="row-name serif">${item.name}</span><span class="row-cost serif">${kr(item.price * l.qty)}</span></div>
                <div class="qty">
                  <button class="pill" type="button" data-id="${l.id}" data-step="-1" aria-label="Minska ${item.name}" aria-describedby="q-${l.id}">−</button>
                  <output id="q-${l.id}">${l.qty}</output>
                  <button class="pill" type="button" data-id="${l.id}" data-step="1" aria-label="Öka ${item.name}" aria-describedby="q-${l.id}">+</button>
                </div>
              </li>`;
            }).join("") + "</ul>"
          : `<p class="empty" tabindex="-1">Tom.</p>`;
        $("sum").textContent = kr(total);
        $("note").textContent = total >= FREE ? "Fri frakt." : `Plus frakt ${kr(SHIPPING)}.`;
        $("sheet").toggleAttribute("data-empty", !cart.length);
        $("pay").setAttribute("aria-disabled", String(!cart.length));
      }

      function add(id) {
        const hit = cart.find((l) => l.id === id);
        if (hit) hit.qty = Math.min(hit.qty + 1, 99);
        else cart.push({ id, qty: 1 });
        save();
        drawCart();
        openCart();
      }

      function openCart() {
        if (cartDialog.open) return;
        // The page loses its scrollbar while the cart is open; hold its place.
        const bar = innerWidth - document.documentElement.clientWidth;
        if (bar > 0) document.documentElement.style.paddingRight = bar + "px";
        cartDialog.showModal();
      }

      // Events
      $("grid").addEventListener("click", (e) => {
        const card = e.target.closest(".card");
        if (!card) return;
        show(card.dataset.id);
        window.scrollTo(0, 0);
        $("name").focus({ preventScroll: true });
      });

      $("klam").addEventListener("click", () => {
        const back = pick !== "smor";
        if (back) show("smor");
        play();
        if (back) $("name").focus({ preventScroll: true });
      });

      $("take").addEventListener("click", () => add(pick));
      $("open").addEventListener("click", openCart);
      $("close").addEventListener("click", () => cartDialog.close());
      // Close on a single click that starts and ends on the backdrop, so a double click on Ta den does not.
      let downOnBackdrop = false;
      cartDialog.addEventListener("pointerdown", (e) => { downOnBackdrop = e.target === cartDialog; });
      cartDialog.addEventListener("click", (e) => {
        if (e.target === cartDialog && downOnBackdrop && e.detail < 2) cartDialog.close();
      });
      cartDialog.addEventListener("close", () => { document.documentElement.style.paddingRight = ""; });

      $("lines").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-step]");
        if (!btn) return;
        const line = cart.find((l) => l.id === btn.dataset.id);
        if (!line) return;
        line.qty = Math.min(line.qty + Number(btn.dataset.step), 99);
        const gone = line.qty < 1;
        if (gone) cart = cart.filter((l) => l !== line);
        save();
        drawCart();
        const again = $("lines").querySelector(`[data-id="${btn.dataset.id}"][data-step="${btn.dataset.step}"]`);
        (again || $("lines").querySelector(".empty") || $("cart-title")).focus();
      });

      $("pay").addEventListener("click", () => {
        if (!cart.length) return;
        const url = SHOP + cart.map((l) => `${items[l.id].variant}:${l.qty}`).join(",");
        try {
          sessionStorage.setItem(KEY, JSON.stringify(cart));
          localStorage.removeItem(KEY);
        } catch (e) {}
        location.href = url;
      });

      // Film
      // Reduced motion: no autoplay, no loop. Kläm still plays it once.
      const calm = matchMedia("(prefers-reduced-motion: reduce)");
      function motion() {
        film.autoplay = !calm.matches;
        film.loop = !calm.matches;
        if (calm.matches) film.pause();
        else if (pick === "smor") film.play().catch(() => {});
      }
      motion();
      calm.addEventListener("change", motion);

      window.addEventListener("pageshow", (e) => {
        if (!e.persisted) return;
        if (cart.length) save();
        if (pick === "smor" && film.autoplay) film.play().catch(() => {});
      });
      window.addEventListener("storage", (e) => {
        if (e.key === KEY) { cart = load(); drawCart(); }
      });

      drawCart();
    })();
  </script>
</body>
</html>
