<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slinkynsquishy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#24170f; --paper:#f6efe4; --butter:#f2c14e; --foam:#fffaf3; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ink); color: #fffaf3; font-family: Outfit, system-ui, sans-serif; }
    button { cursor: pointer; font: inherit; }
    .stage { position: relative; height: 100dvh; overflow: hidden; background: #1a120c; }
    video, .still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .top, .dock { position: absolute; left: 0; right: 0; z-index: 2; }
    .top { top: 0; display: flex; justify-content: space-between; align-items: center; padding: 16px; }
    .brand { font-family: Fraunces, serif; font-size: 1.5rem; color: var(--ink); margin: 0; }
    .bag { height: 44px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); padding: 0 16px; }
    .dock { bottom: 0; padding: 64px 16px 20px; background: linear-gradient(transparent, rgba(36,23,15,.82)); }
    .picks { display: flex; gap: 8px; overflow: auto; padding-bottom: 12px; }
    .picks button { width: 64px; height: 64px; padding: 0; border: 0; border-radius: 16px; overflow: hidden; flex: none; }
    .picks button.on { outline: 2px solid var(--butter); }
    .picks img { width: 100%; height: 100%; object-fit: cover; }
    .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
    h1 { font-family: Fraunces, serif; font-size: 3rem; line-height: .9; margin: 0; letter-spacing: -.04em; }
    .price { font-family: Fraunces, serif; font-size: 1.8rem; margin: 0; }
    .muted { margin: 4px 0 0; color: rgba(255,250,243,.8); }
    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .acts button { height: 56px; border: 0; border-radius: 999px; }
    .ghost { background: var(--paper); color: var(--ink); }
    .buy { background: var(--butter); color: var(--ink); font-weight: 500; }
    .sheet { display: none; position: fixed; inset: 0; background: rgba(36,23,15,.4); z-index: 5; }
    .sheet.on { display: block; }
    aside { position: absolute; top: 0; right: 0; bottom: 0; width: min(100%, 28rem); background: var(--paper); color: var(--ink); padding: 20px; display: flex; flex-direction: column; }
    .line { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e4d5c4; padding: 14px 0; }
    .qty { display: flex; gap: 8px; align-items: center; }
    .qty button { width: 44px; height: 44px; border: 0; border-radius: 999px; background: var(--foam); }
  </style>
</head>
<body>
  <section class="stage">
    <video id="film" src="img/klam.mp4" poster="img/klam.jpg" muted playsinline autoplay></video>
    <img id="still" class="still" alt="" hidden>
    <div class="top">
      <p class="brand">slinkynsquishy</p>
      <button class="bag" id="open" type="button">Korg <span id="n">0</span></button>
    </div>
    <div class="dock">
      <div class="picks" id="picks"></div>
      <div class="row">
        <div>
          <h1 id="name">Smöret</h1>
          <p class="muted" id="line">Till barnet. Eller till dig.</p>
        </div>
        <p class="price" id="price">79 kr</p>
      </div>
      <div class="acts">
        <button class="ghost" id="klam" type="button">Kläm</button>
        <button class="buy" id="take" type="button">Ta den</button>
      </div>
    </div>
  </section>
  <div class="sheet" id="sheet">
    <aside>
      <div class="row">
        <h1>Korgen</h1>
        <button class="ghost" id="close" type="button" style="width:44px;height:44px;border-radius:999px">×</button>
      </div>
      <div id="lines" style="flex:1;overflow:auto"></div>
      <p class="price" id="sum"></p>
      <button class="buy" id="pay" type="button" style="width:100%;margin-top:12px">Betala</button>
    </aside>
  </div>
  <script>
    const shop = "https://pqwbeh-yy.myshopify.com/cart/";
    const items = {
      smor: { name: "Smöret", price: 79, line: "Till barnet. Eller till dig.", img: "img/smor.jpg", id: "58793534456139" },
      toast: { name: "Toasten", price: 79, line: "Den som ser ut som frukost.", img: "img/toast.jpg", id: "58793534521675" },
      ost: { name: "Osten", price: 69, line: "Hål att trycka tummen i.", img: "img/ost.jpg", id: "58793534587211" },
      persika: { name: "Persikan", price: 49, line: "Liten nog för fickan.", img: "img/persika.jpg", id: "58793534816587" },
      mochi: { name: "Mochi", price: 99, line: "Tre som försvinner.", img: "img/mochi.jpg", id: "58793534882123" },
      tre: { name: "Tre smör", price: 199, line: "Fri frakt.", img: "img/tre.jpg", id: "58793535603019" },
      klass: { name: "Klassen", price: 249, line: "Tolv stycken. Fri frakt.", img: "img/hand.jpg", id: "58793535668555" }
    };
    const picks = ["smor", "toast", "ost", "persika", "mochi"];
    let pick = "smor";
    let cart = [];
    const film = document.getElementById("film");
    const still = document.getElementById("still");
    function show(id) {
      pick = id;
      const item = items[id];
      document.getElementById("name").textContent = item.name;
      document.getElementById("line").textContent = item.line;
      document.getElementById("price").textContent = item.price + " kr";
      document.getElementById("klam").textContent = id === "smor" ? "Kläm" : "Se klämmen";
      if (id === "smor") {
        still.hidden = true;
        film.hidden = false;
        film.currentTime = 0;
        film.play();
      } else {
        film.pause();
        film.hidden = true;
        still.hidden = false;
        still.src = item.img;
      }
      drawPicks();
    }
    function drawPicks() {
      document.getElementById("picks").innerHTML = picks.map((id) =>
        `<button class="${id === pick ? "on" : ""}" data-id="${id}" type="button"><img src="${items[id].img}" alt="${items[id].name}"></button>`
      ).join("");
    }
    function drawCart() {
      const n = cart.reduce((s, l) => s + l.qty, 0);
      const goods = cart.reduce((s, l) => s + items[l.id].price * l.qty, 0);
      document.getElementById("n").textContent = n;
      document.getElementById("lines").innerHTML = cart.map((l) =>
        `<div class="line"><div><strong>${items[l.id].name}</strong><div>${items[l.id].price} kr</div></div><div class="qty"><button data-m="${l.id}" type="button">−</button><span>${l.qty}</span><button data-p="${l.id}" type="button">+</button></div></div>`
      ).join("") || "<p>Tom.</p>";
      document.getElementById("sum").textContent = goods ? goods + " kr" : "";
    }
    function add(id) {
      const hit = cart.find((l) => l.id === id);
      if (hit) hit.qty += 1; else cart.push({ id, qty: 1 });
      drawCart();
      document.getElementById("sheet").classList.add("on");
    }
    document.getElementById("picks").onclick = (e) => {
      const b = e.target.closest("button");
      if (b) show(b.dataset.id);
    };
    document.getElementById("klam").onclick = () => {
      if (pick !== "smor") show("smor");
      else { film.currentTime = 0; film.play(); }
    };
    film.onclick = () => { film.currentTime = 0; film.play(); };
    document.getElementById("take").onclick = () => add(pick);
    document.getElementById("open").onclick = () => document.getElementById("sheet").classList.add("on");
    document.getElementById("close").onclick = () => document.getElementById("sheet").classList.remove("on");
    document.getElementById("sheet").onclick = (e) => { if (e.target.id === "sheet") e.currentTarget.classList.remove("on"); };
    document.getElementById("lines").onclick = (e) => {
      const m = e.target.dataset.m, p = e.target.dataset.p, id = m || p;
      if (!id) return;
      const line = cart.find((l) => l.id === id);
      line.qty += p ? 1 : -1;
      if (line.qty < 1) cart = cart.filter((l) => l.id !== id);
      drawCart();
    };
    document.getElementById("pay").onclick = () => {
      if (!cart.length) return;
      location.href = shop + cart.map((l) => items[l.id].id + ":" + l.qty).join(",");
    };
    show("smor");
    drawCart();
  </script>
</body>
</html>
