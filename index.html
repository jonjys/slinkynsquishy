<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slinkynsquishy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0c0a09; --cream:#f4efe6; --gold:#e7b23a; --mute:rgba(244,239,230,.5); }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--ink); color: var(--cream); font-family: Outfit, system-ui, sans-serif; }
    button, a { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; padding: 0; }
    img, video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .side { position: fixed; inset: 0 auto 0 0; width: 240px; display: flex; flex-direction: column; padding: 32px 26px 24px; background: var(--ink); border-right: 1px solid rgba(231,178,58,.35); z-index: 20; }
    .logo { display: block; font-family: Syne, sans-serif; font-weight: 800; font-size: 1.65rem; letter-spacing: -.045em; line-height: 1; color: var(--cream); text-decoration: none; }
    .side nav { display: flex; flex-direction: column; gap: 2px; margin-top: 48px; }
    .side nav button { text-align: left; font-family: Syne, sans-serif; font-weight: 700; font-size: 1.7rem; letter-spacing: -.04em; color: var(--mute); line-height: 1.2; }
    .side nav button.on { color: var(--cream); }
    .bag { margin-top: auto; height: 48px; border-radius: 999px; background: var(--cream); color: var(--ink); font-weight: 500; }
    .top { display: none; }
    main { margin-left: 240px; }
    .hero { min-height: 100vh; display: grid; grid-template-columns: .9fr 1.1fr; }
    .copy { display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 40px 48px; }
    .kicker { margin: 0 0 14px; color: var(--gold); letter-spacing: .18em; text-transform: uppercase; font-size: .72rem; }
    h1, h2 { font-family: Syne, sans-serif; font-weight: 800; letter-spacing: -.055em; margin: 0; }
    h1 { font-size: clamp(4.6rem, 8vw, 7.6rem); line-height: .82; }
    .lede { margin: 18px 0 0; max-width: 16rem; color: var(--mute); font-size: 1.05rem; }
    .price { font-family: Syne, sans-serif; font-weight: 700; font-size: 2rem; margin: 22px 0; }
    .solid { height: 54px; padding: 0 26px; border-radius: 999px; background: var(--gold); color: var(--ink); font-weight: 600; width: fit-content; }
    .media { position: relative; min-height: 100vh; background: #1a1511; }
    .media video, .media img { position: absolute; inset: 0; }
    .replay { position: absolute; left: 16px; bottom: 16px; height: 42px; padding: 0 16px; border-radius: 999px; background: var(--cream); color: var(--ink); z-index: 1; }
    .shop { padding: 28px 22px 72px; }
    .shop h2 { font-size: clamp(3rem, 6vw, 5rem); line-height: .9; margin: 10px 6px 18px; }
    .bento { display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px 16px; }
    .tile { text-align: left; }
    .pic { border-radius: 18px; overflow: hidden; aspect-ratio: 1; background: #1a1511; }
    .wide { grid-column: 1 / -1; }
    .wide .pic { aspect-ratio: 2.15 / 1; }
    .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 4px 0; }
    .meta strong { font-family: Syne, sans-serif; font-weight: 700; font-size: 1.45rem; letter-spacing: -.03em; }
    .meta span { color: var(--mute); }
    .add { margin-top: 2px; color: var(--gold); text-decoration: underline; text-underline-offset: 3px; }
    footer { padding: 10px 28px 36px; color: var(--mute); display: flex; justify-content: space-between; gap: 16px; }
    .sheet { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
    .sheet.on { display: block; }
    aside { position: absolute; top: 0; right: 0; bottom: 0; width: min(100%, 26rem); background: var(--cream); color: var(--ink); padding: 22px; display: flex; flex-direction: column; }
    .aside-top, .line { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    aside h2 { font-size: 2.2rem; }
    .x { width: 40px; height: 40px; border-radius: 999px; background: var(--ink); color: var(--cream); }
    .line { padding: 14px 0; border-bottom: 1px solid #e4d8c8; }
    .qty { display: flex; align-items: center; gap: 8px; }
    .qty button { width: 36px; height: 36px; border-radius: 999px; background: #efe6da; }
    .pay { margin-top: 16px; height: 54px; border-radius: 999px; background: var(--ink); color: var(--cream); }
    .veil { display: none; }
    @media (max-width: 900px) {
      .side { transform: translateX(-105%); transition: transform .25s ease; width: min(86vw, 320px); }
      .side.on { transform: none; }
      .veil.on { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 15; }
      .top { display: flex; position: sticky; top: 0; z-index: 10; align-items: center; justify-content: space-between; height: 60px; padding: 0 14px; background: rgba(12,10,9,.92); backdrop-filter: blur(10px); }
      .top .logo { font-size: 1.05rem; line-height: .95; }
      .icon { height: 40px; padding: 0 12px; border-radius: 999px; background: var(--cream); color: var(--ink); }
      main { margin-left: 0; }
      .hero { min-height: 0; display: flex; flex-direction: column; }
      .media { order: -1; min-height: 58vh; height: 58vh; }
      .copy { padding: 22px 16px 8px; }
      h1 { font-size: 3.15rem; }
      .shop { padding: 18px 14px 48px; }
      .bento { grid-template-columns: 1fr 1fr; gap: 14px 10px; }
      .wide { grid-column: 1 / -1; }
      .wide .pic { aspect-ratio: 1.5 / 1; }
      .meta strong { font-size: 1.05rem; }
      footer { flex-direction: column; padding: 8px 16px 28px; }
    }
  </style>
</head>
<body>
  <div class="veil" id="veil"></div>
  <aside class="side" id="side">
    <a class="logo" href="#top">slinkyn<br>squishy</a>
    <nav>
      <button type="button" data-go="alla" class="on">Butiken</button>
      <button type="button" data-go="smor">Smör</button>
      <button type="button" data-go="mat">Mat</button>
      <button type="button" data-go="paket">Paket</button>
      <button type="button" data-go="klam">Kläm</button>
    </nav>
    <button class="bag" id="openCart" type="button">Korg <span id="n">0</span></button>
  </aside>

  <div class="top">
    <button class="icon" id="openMenu" type="button">Meny</button>
    <a class="logo" href="#top">slinkynsquishy</a>
    <button class="icon" id="openCart2" type="button">Korg <span id="n2">0</span></button>
  </div>

  <main id="top">
    <section class="hero">
      <div class="copy">
        <p class="kicker">Squishy</p>
        <h1>Smöret.</h1>
        <p class="lede">Håll inne. Det kommer tillbaka.</p>
        <p class="price">79 kr</p>
        <button class="solid" id="takeHero" type="button">Ta den</button>
      </div>
      <div class="media">
        <video id="film" src="img/klam.mp4" poster="img/klam.jpg" muted playsinline autoplay loop></video>
        <button class="replay" id="replay" type="button">Kläm</button>
      </div>
    </section>

    <section class="shop" id="butik">
      <h2 id="heading">Butiken</h2>
      <div class="bento" id="grid"></div>
    </section>
  </main>

  <footer>
    <span>Fri frakt över 199 kr. Annars 39 kr.</span>
    <span>Från tre år. Inte i munnen. Nytto Labs.</span>
  </footer>

  <div class="sheet" id="sheet">
    <aside>
      <div class="aside-top">
        <h2>Korgen</h2>
        <button class="x" id="closeCart" type="button" aria-label="Stäng">×</button>
      </div>
      <div id="lines" style="flex:1;overflow:auto"></div>
      <p class="price" id="sum"></p>
      <button class="pay" id="pay" type="button">Betala</button>
    </aside>
  </div>

  <script>
    const shop = "https://pqwbeh-yy.myshopify.com/cart/";
    const items = [
      { id: "toast", cat: "mat", name: "Toasten", price: 79, img: "img/toast.jpg", variant: "58793534521675" },
      { id: "persika", cat: "mat", name: "Persikan", price: 49, img: "img/persika.jpg", variant: "58793534816587" },
      { id: "mochi", cat: "mat", name: "Mochi", price: 99, img: "img/mochi.jpg", variant: "58793534882123", wide: true },
      { id: "ost", cat: "mat", name: "Osten", price: 69, img: "img/ost.jpg", variant: "58793534587211" },
      { id: "smor", cat: "smor", name: "Smöret", price: 79, img: "img/smor.jpg", variant: "58793534456139" },
      { id: "tre", cat: "paket", name: "Tre smör", price: 199, img: "img/tre.jpg", variant: "58793535603019", wide: true },
      { id: "klass", cat: "paket", name: "Klassen", price: 249, img: "img/hand.jpg", variant: "58793535668555", wide: true }
    ];
    const titles = { alla: "Butiken", smor: "Smör", mat: "Mat", paket: "Paket" };
    const byId = Object.fromEntries(items.map((item) => [item.id, item]));
    let filter = "alla";
    let cart = [];
    const film = document.getElementById("film");

    function visible() {
      if (filter === "alla") return items;
      if (filter === "smor") return items.filter((item) => item.cat === "smor" || item.id === "tre");
      return items.filter((item) => item.cat === filter);
    }

    function drawGrid() {
      document.getElementById("heading").textContent = titles[filter] || "Butiken";
      document.getElementById("grid").innerHTML = visible().map((item) => `
        <article class="tile ${filter === "alla" && item.wide ? "wide" : ""}">
          <div class="pic"><img src="${item.img}" alt="${item.name}"></div>
          <div class="meta"><strong>${item.name}</strong><span>${item.price} kr</span></div>
          <button class="add" type="button" data-add="${item.id}">Lägg i</button>
        </article>`).join("");
      document.querySelectorAll(".side [data-go]").forEach((node) => {
        node.classList.toggle("on", node.dataset.go === filter || (filter === "alla" && node.dataset.go === "alla"));
      });
    }

    function drawCart() {
      const count = cart.reduce((sum, line) => sum + line.qty, 0);
      const goods = cart.reduce((sum, line) => sum + byId[line.id].price * line.qty, 0);
      document.getElementById("n").textContent = count;
      document.getElementById("n2").textContent = count;
      document.getElementById("lines").innerHTML = cart.map((line) => `
        <div class="line">
          <div><strong>${byId[line.id].name}</strong><div>${byId[line.id].price} kr</div></div>
          <div class="qty">
            <button type="button" data-m="${line.id}">−</button>
            <span>${line.qty}</span>
            <button type="button" data-p="${line.id}">+</button>
          </div>
        </div>`).join("") || "<p>Korgen är tom.</p>";
      document.getElementById("sum").textContent = goods ? goods + " kr" : "";
    }

    function add(id) {
      const hit = cart.find((line) => line.id === id);
      if (hit) hit.qty += 1;
      else cart.push({ id, qty: 1 });
      drawCart();
      document.getElementById("sheet").classList.add("on");
    }

    function closeMenu() {
      document.getElementById("side").classList.remove("on");
      document.getElementById("veil").classList.remove("on");
    }

    function go(key) {
      closeMenu();
      if (key === "klam") {
        document.getElementById("top").scrollIntoView({ behavior: "smooth" });
        film.currentTime = 0;
        film.play();
        return;
      }
      filter = key;
      drawGrid();
      document.getElementById("butik").scrollIntoView({ behavior: "smooth" });
    }

    document.body.addEventListener("click", (event) => {
      const goBtn = event.target.closest("[data-go]");
      if (goBtn) go(goBtn.dataset.go);
      const addBtn = event.target.closest("[data-add]");
      if (addBtn) add(addBtn.dataset.add);
      const id = event.target.dataset.m || event.target.dataset.p;
      if (!id || !byId[id]) return;
      const line = cart.find((entry) => entry.id === id);
      if (!line) return;
      line.qty += event.target.dataset.p ? 1 : -1;
      if (line.qty < 1) cart = cart.filter((entry) => entry.id !== id);
      drawCart();
    });

    function openCart() { document.getElementById("sheet").classList.add("on"); }
    document.getElementById("takeHero").onclick = () => add("smor");
    document.getElementById("replay").onclick = () => { film.currentTime = 0; film.play(); };
    document.getElementById("openCart").onclick = openCart;
    document.getElementById("openCart2").onclick = openCart;
    document.getElementById("closeCart").onclick = () => document.getElementById("sheet").classList.remove("on");
    document.getElementById("sheet").onclick = (event) => { if (event.target.id === "sheet") event.currentTarget.classList.remove("on"); };
    document.getElementById("openMenu").onclick = () => {
      document.getElementById("side").classList.add("on");
      document.getElementById("veil").classList.add("on");
    };
    document.getElementById("veil").onclick = closeMenu;
    document.getElementById("pay").onclick = () => {
      if (!cart.length) return;
      location.href = shop + cart.map((line) => byId[line.id].variant + ":" + line.qty).join(",");
    };
    drawGrid();
    drawCart();
  </script>
</body>
</html>
