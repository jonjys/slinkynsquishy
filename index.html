<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slinkynsquishy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1c140e; --paper:#f4efe6; --line:#e4d9c8; --card:#fffaf3; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Outfit, system-ui, sans-serif; }
    button, a { font: inherit; color: inherit; }
    button { cursor: pointer; }
    img, video { display: block; max-width: 100%; }
    header { position: sticky; top: 0; z-index: 4; display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; background: rgba(244,239,230,.92); backdrop-filter: blur(12px); border-bottom: 1px solid transparent; }
    .logo { font-family: Fraunces, serif; font-size: 1.55rem; letter-spacing: -.03em; text-decoration: none; }
    .bag { height: 42px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); }
    .hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(280px, .8fr); gap: 56px; align-items: center; max-width: 1120px; margin: 0 auto; padding: 28px 28px 8px; }
    .stage { position: relative; aspect-ratio: 1; border-radius: 28px; overflow: hidden; background: #e8e0d2; }
    .stage video, .stage img { width: 100%; height: 100%; object-fit: cover; }
    .replay { position: absolute; left: 14px; bottom: 14px; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--card); }
    .buy h1 { font-family: Fraunces, serif; font-size: clamp(3.4rem, 6vw, 5.4rem); line-height: .88; letter-spacing: -.045em; margin: 8px 0 12px; }
    .eyebrow, .ship, .line { margin: 0; color: #6d5c4a; }
    .price { font-family: Fraunces, serif; font-size: 2rem; margin: 18px 0; }
    .take { height: 56px; width: min(100%, 280px); border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 1.05rem; }
    .ship { margin-top: 14px; font-size: .95rem; }
    .grid { max-width: 1120px; margin: 0 auto; padding: 36px 28px 80px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px 18px; }
    .cell { display: grid; gap: 8px; align-content: start; }
    .card { display: grid; gap: 10px; padding: 0; border: 0; background: transparent; text-align: left; }
    .card .pic { aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: #e8e0d2; }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card.on .pic { outline: 2px solid var(--ink); outline-offset: 4px; }
    .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .meta strong { font-family: Fraunces, serif; font-size: 1.35rem; font-weight: 560; }
    .add { justify-self: start; padding: 0; border: 0; background: none; text-decoration: underline; text-underline-offset: 3px; }
    .sheet { display: none; position: fixed; inset: 0; background: rgba(28,20,14,.35); z-index: 6; }
    .sheet.on { display: block; }
    aside { position: absolute; top: 0; right: 0; bottom: 0; width: min(100%, 26rem); background: var(--card); padding: 22px; display: flex; flex-direction: column; }
    .line-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .qty { display: flex; align-items: center; gap: 8px; }
    .qty button { width: 40px; height: 40px; border: 0; border-radius: 999px; background: var(--paper); }
    .pay { margin-top: 16px; height: 56px; width: 100%; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); }
    .close { width: 42px; height: 42px; border: 0; border-radius: 999px; background: var(--paper); }
    @media (max-width: 860px) {
      header, .hero, .grid { padding-left: 16px; padding-right: 16px; }
      .hero { grid-template-columns: 1fr; gap: 22px; padding-top: 16px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 16px 12px; }
      .buy h1 { font-size: 3.2rem; }
      .take { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">slinkynsquishy</a>
    <button class="bag" id="open" type="button">Korg <span id="n">0</span></button>
  </header>
  <section class="hero">
    <div class="stage">
      <video id="film" src="img/klam.mp4" poster="img/klam.jpg" muted playsinline autoplay loop></video>
      <img id="still" alt="" hidden>
      <button class="replay" id="klam" type="button">Kläm</button>
    </div>
    <div class="buy">
      <p class="eyebrow">Squishy</p>
      <h1 id="name">Smöret</h1>
      <p class="line" id="line">Till barnet. Eller till dig.</p>
      <p class="price" id="price">79 kr</p>
      <button class="take" id="take" type="button">Ta den</button>
      <p class="ship">Fri frakt över 199 kr. Annars 39 kr.</p>
    </div>
  </section>
  <section class="grid" id="grid"></section>
  <div class="sheet" id="sheet">
    <aside>
      <div class="meta">
        <h1 style="font-family:Fraunces,serif;font-size:2.4rem;margin:0">Korgen</h1>
        <button class="close" id="close" type="button">×</button>
      </div>
      <div id="lines" style="flex:1;overflow:auto"></div>
      <p class="price" id="sum"></p>
      <button class="pay" id="pay" type="button">Betala</button>
    </aside>
  </div>
  <script>
    const shop = "https://pqwbeh-yy.myshopify.com/cart/";
    const items = {
      smor: { name: "Smöret", price: 79, line: "Till barnet. Eller till dig.", img: "img/smor.jpg", id: "58793534456139" },
      toast: { name: "Toasten", price: 79, line: "Den som ser ut som frukost.", img: "img/toast.jpg", id: "58793534521675" },
      ost: { name: "Osten", price: 69, line: "Hål att trycka tummen i.", img: "img/ost.jpg", id: "58793534587211" },
      persika: { name: "Persikan", price: 49, line: "Liten nog för fickan.", img: "img/persika.jpg", id: "58793534816587" },
      mochi: { name: "Mochi", price: 99, line: "Tre som försvinner.", img: "img/mochi.jpg", id: "58793534882123" },
      tre: { name: "Tre smör", price: 199, line: "Fri frakt.", img: "img/tre.jpg", id: "58793535603019" },
      klass: { name: "Klassen", price: 249, line: "Tolv stycken. Fri frakt.", img: "img/hand.jpg", id: "58793535668555" }
    };
    const order = ["smor", "toast", "ost", "persika", "mochi", "tre"];
    let pick = "smor";
    let cart = [];
    const film = document.getElementById("film");
    const still = document.getElementById("still");
    function show(id) {
      pick = id;
      const item = items[id];
      document.getElementById("name").textContent = item.name;
      document.getElementById("line").textContent = item.line;
      document.getElementById("price").textContent = item.price + " kr";
      if (id === "smor") {
        still.hidden = true;
        film.hidden = false;
        film.currentTime = 0;
        film.play();
      } else {
        film.pause();
        film.hidden = true;
        still.hidden = false;
        still.src = item.img;
      }
      draw();
    }
    function draw() {
      document.getElementById("grid").innerHTML = order.map((id) => {
        const item = items[id];
        return `<article class="cell"><button class="card ${id === pick ? "on" : ""}" data-id="${id}" type="button"><span class="pic"><img src="${item.img}" alt="${item.name}"></span><span class="meta"><strong>${item.name}</strong><span>${item.price} kr</span></span></button></article>`;
      }).join("");
    }
    function drawCart() {
      const n = cart.reduce((s, l) => s + l.qty, 0);
      const goods = cart.reduce((s, l) => s + items[l.id].price * l.qty, 0);
      document.getElementById("n").textContent = n;
      document.getElementById("lines").innerHTML = cart.map((l) =>
        `<div class="line-row"><div><strong>${items[l.id].name}</strong><div>${items[l.id].price} kr</div></div><div class="qty"><button data-m="${l.id}" type="button">−</button><span>${l.qty}</span><button data-p="${l.id}" type="button">+</button></div></div>`
      ).join("") || "<p>Tom.</p>";
      document.getElementById("sum").textContent = goods ? goods + " kr" : "";
    }
    function add(id) {
      const hit = cart.find((l) => l.id === id);
      if (hit) hit.qty += 1; else cart.push({ id, qty: 1 });
      drawCart();
      document.getElementById("sheet").classList.add("on");
    }
    document.getElementById("grid").onclick = (e) => {
      const addBtn = e.target.closest("[data-add]");
      if (addBtn) { add(addBtn.dataset.add); return; }
      const card = e.target.closest("[data-id]");
      if (card) { show(card.dataset.id); window.scrollTo({ top: 0, behavior: "smooth" }); }
    };
    document.getElementById("klam").onclick = () => { show("smor"); film.currentTime = 0; film.play(); };
    document.getElementById("take").onclick = () => add(pick);
    document.getElementById("open").onclick = () => document.getElementById("sheet").classList.add("on");
    document.getElementById("close").onclick = () => document.getElementById("sheet").classList.remove("on");
    document.getElementById("sheet").onclick = (e) => { if (e.target.id === "sheet") e.currentTarget.classList.remove("on"); };
    document.getElementById("lines").onclick = (e) => {
      const id = e.target.dataset.m || e.target.dataset.p;
      if (!id) return;
      const line = cart.find((l) => l.id === id);
      line.qty += e.target.dataset.p ? 1 : -1;
      if (line.qty < 1) cart = cart.filter((l) => l.id !== id);
      drawCart();
    };
    document.getElementById("pay").onclick = () => {
      if (!cart.length) return;
      location.href = shop + cart.map((l) => items[l.id].id + ":" + l.qty).join(",");
    };
    show("smor");
    drawCart();
  </script>
</body>
</html>
