<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>slinkynsquishy</title>
  <meta name="description" content="Mjuka squishies. Fri frakt över 199 kr.">
  <meta name="theme-color" content="#f4efe6">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="sv_SE">
  <meta property="og:url" content="https://slinkynsquishy.se/">
  <meta property="og:title" content="slinkynsquishy">
  <meta property="og:description" content="Mjuka squishies. Fri frakt över 199 kr.">
  <meta property="og:image" content="https://slinkynsquishy.se/img/klam.jpg">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Outfit:wght@400;500&display=swap">
  <link rel="preload" href="img/klam.jpg" as="image" fetchpriority="high">
  <style>
    :root {
      --paper: #f4efe6;
      --ink: #1c140e;
      --muted: #6d5c4a;
      --card: #fffaf3;
      --hair: rgba(28, 20, 14, .12);
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
      --gutter: 16px;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html:has(dialog[open]) { overflow: hidden; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
    h1, h2, p, ul { margin: 0; }
    ul { padding: 0; list-style: none; }
    img, video { display: block; }
    button { margin: 0; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .serif { font-family: var(--serif); font-optical-sizing: auto; font-weight: 420; }
    .wrap { width: 100%; max-width: 1120px; margin-inline: auto; padding-inline: max(var(--gutter), env(safe-area-inset-left)) max(var(--gutter), env(safe-area-inset-right)); }

    /* Header */
    .top { position: sticky; top: 0; z-index: 2; background: var(--paper); }
    .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
    .logo { font-size: min(1.4rem, 7vw); letter-spacing: -.02em; line-height: 1; color: var(--ink); text-decoration: none; }
    .pill { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; white-space: nowrap; }
    .bag { gap: .35em; height: 40px; padding: 0 18px; background: var(--ink); color: var(--paper); font-weight: 500; font-size: .95rem; }
    .bag span { font-variant-numeric: tabular-nums; }

    /* Hero */
    .hero { display: grid; padding-top: 4px; }
    .frame {
      position: relative; isolation: isolate; overflow: hidden;
      width: 100%; max-width: max(280px, calc(100vh - 290px)); max-width: max(280px, calc(100svh - 290px));
      aspect-ratio: 1 / 1; border-radius: 24px; background: var(--card);
    }
    .frame video, .frame img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center; border-radius: inherit;
    }
    .frame [hidden] { display: none; }
    /* iOS Low Power Mode would otherwise draw its own play glyph on the thumb. */
    .frame video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
    .frame video::-webkit-media-controls { display: none !important; }
    .klam {
      position: absolute; left: 14px; bottom: 14px; z-index: 1;
      height: 38px; padding: 0 16px; background: var(--card); color: var(--ink);
      font-weight: 500; font-size: .95rem; box-shadow: 0 1px 2px rgba(28, 20, 14, .12);
    }

    .buy { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: 16px; padding-top: 18px; }
    .kind, .line, .take, .ship { grid-column: 1 / -1; }
    .kind { color: var(--muted); font-size: .9rem; }
    .title { font-size: min(2.75rem, 13vw); line-height: .95; letter-spacing: -.025em; margin-top: 4px; }
    .title:focus, #cart-title:focus, .empty:focus { outline: none; }
    .cost { grid-row: 2; grid-column: 2; font-size: min(1.75rem, 8.5vw); line-height: 1; white-space: nowrap; }
    .line { margin-top: 8px; font-size: 1.05rem; }
    .take {
      width: 100%; height: 56px; margin-top: 18px; padding: 0 24px;
      background: var(--ink); color: var(--paper); font-weight: 500; font-size: 1.05rem;
    }
    .ship { margin-top: 12px; color: var(--muted); font-size: .875rem; }

    /* Catalog */
    .shop { padding-top: 48px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 12px; align-items: start; }
    .card { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; border-radius: 22px; }
    .card:focus-visible { outline-offset: 8px; border-radius: 26px 26px 10px 10px; }
    .pic { display: block; aspect-ratio: 1 / 1; border-radius: 22px; overflow: hidden; background: var(--card); }
    .pic img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .card[aria-pressed="true"] .pic { outline: 2px solid var(--ink); outline-offset: 4px; }
    .meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 8px; margin-top: 12px; font-size: 1.1rem; line-height: 1.2; }
    .meta span { white-space: nowrap; }

    .wide {
      grid-column: 1 / -1; display: grid; align-items: center; column-gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-columns: subgrid;
      pointer-events: none;
    }
    .wide > * { pointer-events: auto; }
    .wide-text { display: grid; gap: 6px; align-content: center; justify-self: start; }
    .wide-name { font-size: 1.9rem; line-height: 1; letter-spacing: -.025em; }
    .wide-line { font-size: 1rem; }
    .wide-cost { font-size: 1.25rem; margin-top: 6px; }

    .foot { padding-top: 64px; padding-bottom: 40px; color: var(--muted); font-size: .875rem; }

    /* Cart */
    .cart {
      position: fixed; inset: 0 0 0 auto; margin: 0; padding: 0 env(safe-area-inset-right) 0 0;
      width: min(100%, 26rem); max-width: none; height: auto; max-height: none;
      border: 0; background: var(--card); color: var(--ink);
    }
    .cart::backdrop { background: rgba(28, 20, 14, .28); }
    .sheet { display: flex; flex-direction: column; height: 100%; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px 10px; }
    .sheet-head h2 { font: 500 1.25rem/1 var(--sans); }
    .close { height: 40px; padding: 0 16px; background: var(--paper); font-size: .95rem; }
    .lines { flex: 1; overflow-y: auto; padding: 0 24px; overscroll-behavior: contain; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--hair); }
    .row-name { display: block; font-size: 1.2rem; line-height: 1.2; letter-spacing: -.01em; }
    .row-cost { display: block; margin-top: 2px; color: var(--muted); }
    .qty { display: flex; align-items: center; gap: 6px; }
    .qty button { width: 40px; height: 40px; padding: 0; background: var(--paper); font-size: 1.15rem; line-height: 1; }
    .qty output { min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
    .empty { padding: 16px 0; }
    .sheet-foot { padding: 18px 24px calc(24px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hair); }
    .sum { display: flex; justify-content: space-between; align-items: baseline; }
    .sum-cost { font-size: 1.6rem; line-height: 1; }
    .note { margin-top: 6px; color: var(--muted); font-size: .875rem; }
    .pay { width: 100%; height: 56px; margin-top: 16px; background: var(--ink); color: var(--paper); font-weight: 500; font-size: 1.05rem; }
    .pay[aria-disabled="true"] { cursor: default; }
    .sheet[data-empty] .sum, .sheet[data-empty] .note { display: none; }
    .sheet[data-empty] .pay { margin-top: 0; }

    @media (forced-colors: active) {
      .pill { border: 1px solid ButtonText; }
    }

    /* Wide single column (tablets, short windows): frame and buy block share one centred column. */
    @media (min-width: 600px) {
      .hero {
        grid-template-columns: minmax(0, min(100%, max(280px, calc(100vh - 290px))));
        grid-template-columns: minmax(0, min(100%, max(280px, calc(100svh - 290px))));
        justify-content: center;
      }
      .frame { max-width: none; }
    }

    @media (min-width: 860px), (min-width: 600px) and (max-height: 520px) and (orientation: landscape) {
      :root { --gutter: 28px; }
      .top .wrap { height: 72px; }
      .logo { font-size: 1.6rem; }
      .bag { height: 42px; }

      .hero {
        grid-template-columns: minmax(0, min(calc((100% - 56px) * .55), max(240px, calc(100vh - 128px)))) minmax(0, 1fr);
        grid-template-columns: minmax(0, min(calc((100% - 56px) * .55), max(240px, calc(100svh - 128px)))) minmax(0, 1fr);
        column-gap: 56px; align-items: center; padding-top: 28px;
      }
      .frame { max-width: none; border-radius: 28px; }
      .klam { left: 18px; bottom: 18px; height: 40px; }

      .buy { display: block; padding-top: 0; }
      .kind { font-size: .95rem; }
      .title { font-size: clamp(3.25rem, 7.2vw, 5rem); line-height: .92; letter-spacing: -.035em; margin-top: 10px; }
      .line { margin-top: 18px; font-size: 1.125rem; }
      .cost { margin-top: 26px; font-size: 2rem; }
      .take { display: flex; max-width: 280px; margin-top: 22px; }
      .ship { margin-top: 14px; }

      .shop { padding-top: 64px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 44px 28px; }
      .meta { font-size: 1.25rem; margin-top: 14px; }
      .wide { column-gap: 28px; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-columns: subgrid; }
      .wide-text { grid-column: 2 / -1; gap: 8px; }
      .wide-name { font-size: 2.5rem; }
      .wide-line { font-size: 1.05rem; }
      .wide-cost { font-size: 1.4rem; }

      .foot { padding-top: 88px; }
    }

    /* Phone on its side: keep the buy column beside the film. */
    @media (max-height: 520px) and (min-width: 600px) and (orientation: landscape) {
      .top .wrap { height: 60px; }
      .hero { padding-top: 12px; }
      .title { margin-top: 6px; }
      .line { margin-top: 10px; }
      .cost { margin-top: 14px; }
      .take { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo serif" href="/">slinkynsquishy</a>
      <button class="pill bag" id="open" type="button" aria-haspopup="dialog" aria-controls="cart">Korg <span id="count">0</span></button>
    </div>
  </header>

  <main>
    <section class="hero wrap" aria-labelledby="name">
      <div class="frame">
        <video id="film" src="img/klam.mp4" poster="img/klam.jpg" muted autoplay loop playsinline preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true"></video>
        <img id="still" src="" alt="" hidden>
        <button class="pill klam" id="klam" type="button">Kläm</button>
      </div>
      <div class="buy">
        <p class="kind">Squishy</p>
        <h1 class="title serif" id="name" tabindex="-1">Smöret</h1>
        <p class="line" id="line">Till barnet. Eller till dig.</p>
        <p class="cost serif" id="price">79 kr</p>
        <button class="pill take" id="take" type="button">Ta den</button>
        <p class="ship">Fri frakt över 199 kr. Annars 39 kr.</p>
      </div>
    </section>

    <section class="shop wrap" aria-label="Alla">
      <div class="grid" id="grid">
        <button class="card" type="button" aria-pressed="true" data-id="smor" data-variant="58793534456139" data-price="79" data-img="img/smor.jpg" data-line="Till barnet. Eller till dig.">
          <span class="pic"><img src="img/smor.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="meta"><span class="serif">Smöret</span><span class="serif">79 kr</span></span>
        </button>
        <button class="card" type="button" aria-pressed="false" data-id="toast" data-variant="58793534521675" data-price="79" data-img="img/toast.jpg" data-line="Den som ser ut som frukost.">
          <span class="pic"><img src="img/toast.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="meta"><span class="serif">Toasten</span><span class="serif">79 kr</span></span>
        </button>
        <button class="card" type="button" aria-pressed="false" data-id="ost" data-variant="58793534587211" data-price="69" data-img="img/ost.jpg" data-line="Hål att trycka tummen i.">
          <span class="pic"><img src="img/ost.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="meta"><span class="serif">Osten</span><span class="serif">69 kr</span></span>
        </button>
        <button class="card" type="button" aria-pressed="false" data-id="persika" data-variant="58793534816587" data-price="49" data-img="img/persika.jpg" data-line="Liten nog för fickan.">
          <span class="pic"><img src="img/persika.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="meta"><span class="serif">Persikan</span><span class="serif">49 kr</span></span>
        </button>
        <button class="card" type="button" aria-pressed="false" data-id="mochi" data-variant="58793534882123" data-price="99" data-img="img/mochi.jpg" data-line="Tre som försvinner.">
          <span class="pic"><img src="img/mochi.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="meta"><span class="serif">Mochi</span><span class="serif">99 kr</span></span>
        </button>
        <button class="card" type="button" aria-pressed="false" data-id="tre" data-variant="58793535603019" data-price="199" data-img="img/tre.jpg" data-line="Fri frakt.">
          <span class="pic"><img src="img/tre.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="meta"><span class="serif">Tre smör</span><span class="serif">199 kr</span></span>
        </button>
        <button class="card wide" type="button" aria-pressed="false" data-id="klass" data-variant="58793535668555" data-price="249" data-img="img/hand.jpg" data-line="Tolv stycken. Fri frakt.">
          <span class="pic"><img src="img/hand.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="wide-text">
            <span class="wide-name serif">Klassen</span>
            <span class="wide-line">Tolv stycken. Fri frakt.</span>
            <span class="wide-cost serif">249 kr</span>
          </span>
        </button>
      </div>
    </section>
  </main>

  <footer class="foot wrap">
    <p>Säljs av Nytto Labs. Betalning hos Shopify.</p>
  </footer>

  <dialog class="cart" id="cart" aria-labelledby="cart-title">
    <div class="sheet" id="sheet">
      <div class="sheet-head">
        <h2 id="cart-title" tabindex="-1">Korg</h2>
        <button class="pill close" id="close" type="button">Stäng</button>
      </div>
      <div class="lines" id="lines"></div>
      <div class="sheet-foot">
        <div class="sum"><span>Summa</span><span class="sum-cost serif" id="sum">0 kr</span></div>
        <p class="note" id="note"></p>
        <button class="pill pay" id="pay" type="button">Betala</button>
      </div>
    </div>
  </dialog>

  <script>
    (() => {
      const SHOP = "https://pqwbeh-yy.myshopify.com/cart/";
      const FREE = 199;
      const SHIPPING = 39;
      const KEY = "slinkynsquishy-korg";
      const $ = (id) => document.getElementById(id);

      const film = $("film");
      const still = $("still");
      const cartDialog = $("cart");
      const cards = [...document.querySelectorAll(".card")];

      const items = {};
      for (const card of cards) {
        const d = card.dataset;
        items[d.id] = {
          name: card.querySelector(".serif").textContent,
          price: Number(d.price),
          line: d.line,
          img: d.img,
          variant: d.variant
        };
      }

      const kr = (n) => n.toLocaleString("sv-SE") + "\u00a0kr";
      let pick = "smor";

      function play() {
        film.currentTime = 0;
        const p = film.play();
        if (p) p.catch(() => {});
      }

      function show(id) {
        const item = items[id];
        if (!item) return;
        const was = pick;
        pick = id;
        $("name").textContent = item.name;
        $("line").textContent = item.line;
        $("price").textContent = kr(item.price);
        for (const card of cards) card.setAttribute("aria-pressed", String(card.dataset.id === id));
        if (id === "smor") {
          still.hidden = true;
          still.removeAttribute("src");
          film.hidden = false;
          if (was !== "smor" && film.autoplay) play();
        } else {
          film.pause();
          film.hidden = true;
          // Keep the frame empty rather than show the old photo under the new name.
          const thumb = document.querySelector(`.card[data-id="${id}"] img`);
          still.onload = () => { if (pick === id) still.hidden = false; };
          still.src = item.img;
          still.hidden = !(thumb && thumb.complete && thumb.naturalWidth);
        }
      }

      // Cart
      function load() {
        try {
          let raw = localStorage.getItem(KEY);
          if (raw === null) {
            // Betala hands the cart to Shopify; only a Back from there brings it back.
            const nav = performance.getEntriesByType("navigation")[0];
            if (nav && nav.type === "back_forward") raw = sessionStorage.getItem(KEY);
          }
          const saved = JSON.parse(raw || "[]");
          if (Array.isArray(saved)) {
            return saved
              .filter((l) => l && items[l.id] && Number.isInteger(l.qty) && l.qty > 0)
              .map((l) => ({ id: l.id, qty: Math.min(l.qty, 99) }));
          }
        } catch (e) {}
        return [];
      }
      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(cart)); } catch (e) {}
      }

      let cart = load();
      if (cart.length) save();

      function drawCart() {
        const count = cart.reduce((s, l) => s + l.qty, 0);
        const total = cart.reduce((s, l) => s + items[l.id].price * l.qty, 0);
        $("count").textContent = count;
        $("lines").innerHTML = cart.length
          ? "<ul>" + cart.map((l) => {
              const item = items[l.id];
              return `<li class="row">
                <div><span class="row-name serif">${item.name}</span><span class="row-cost serif">${kr(item.price * l.qty)}</span></div>
                <div class="qty">
                  <button class="pill" type="button" data-id="${l.id}" data-step="-1" aria-label="Minska ${item.name}" aria-describedby="q-${l.id}">−</button>
                  <output id="q-${l.id}">${l.qty}</output>
                  <button class="pill" type="button" data-id="${l.id}" data-step="1" aria-label="Öka ${item.name}" aria-describedby="q-${l.id}">+</button>
                </div>
              </li>`;
            }).join("") + "</ul>"
          : `<p class="empty" tabindex="-1">Tom.</p>`;
        $("sum").textContent = kr(total);
        $("note").textContent = total >= FREE ? "Fri frakt." : `Plus frakt ${kr(SHIPPING)}.`;
        $("sheet").toggleAttribute("data-empty", !cart.length);
        $("pay").setAttribute("aria-disabled", String(!cart.length));
      }

      function add(id) {
        const hit = cart.find((l) => l.id === id);
        if (hit) hit.qty = Math.min(hit.qty + 1, 99);
        else cart.push({ id, qty: 1 });
        save();
        drawCart();
        openCart();
      }

      function openCart() {
        if (cartDialog.open) return;
        // The page loses its scrollbar while the cart is open; hold its place.
        const bar = innerWidth - document.documentElement.clientWidth;
        if (bar > 0) document.documentElement.style.paddingRight = bar + "px";
        cartDialog.showModal();
      }

      // Events
      $("grid").addEventListener("click", (e) => {
        const card = e.target.closest(".card");
        if (!card) return;
        show(card.dataset.id);
        window.scrollTo(0, 0);
        $("name").focus({ preventScroll: true });
      });

      $("klam").addEventListener("click", () => {
        const back = pick !== "smor";
        if (back) show("smor");
        play();
        if (back) $("name").focus({ preventScroll: true });
      });

      $("take").addEventListener("click", () => add(pick));
      $("open").addEventListener("click", openCart);
      $("close").addEventListener("click", () => cartDialog.close());
      // Close on a single click that starts and ends on the backdrop, so a double click on Ta den does not.
      let downOnBackdrop = false;
      cartDialog.addEventListener("pointerdown", (e) => { downOnBackdrop = e.target === cartDialog; });
      cartDialog.addEventListener("click", (e) => {
        if (e.target === cartDialog && downOnBackdrop && e.detail < 2) cartDialog.close();
      });
      cartDialog.addEventListener("close", () => { document.documentElement.style.paddingRight = ""; });

      $("lines").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-step]");
        if (!btn) return;
        const line = cart.find((l) => l.id === btn.dataset.id);
        if (!line) return;
        line.qty = Math.min(line.qty + Number(btn.dataset.step), 99);
        const gone = line.qty < 1;
        if (gone) cart = cart.filter((l) => l !== line);
        save();
        drawCart();
        const again = $("lines").querySelector(`[data-id="${btn.dataset.id}"][data-step="${btn.dataset.step}"]`);
        (again || $("lines").querySelector(".empty") || $("cart-title")).focus();
      });

      $("pay").addEventListener("click", () => {
        if (!cart.length) return;
        const url = SHOP + cart.map((l) => `${items[l.id].variant}:${l.qty}`).join(",");
        try {
          sessionStorage.setItem(KEY, JSON.stringify(cart));
          localStorage.removeItem(KEY);
        } catch (e) {}
        location.href = url;
      });

      // Film
      // Reduced motion: no autoplay, no loop. Kläm still plays it once.
      const calm = matchMedia("(prefers-reduced-motion: reduce)");
      function motion() {
        film.autoplay = !calm.matches;
        film.loop = !calm.matches;
        if (calm.matches) film.pause();
        else if (pick === "smor") film.play().catch(() => {});
      }
      motion();
      calm.addEventListener("change", motion);

      window.addEventListener("pageshow", (e) => {
        if (!e.persisted) return;
        if (cart.length) save();
        if (pick === "smor" && film.autoplay) film.play().catch(() => {});
      });
      window.addEventListener("storage", (e) => {
        if (e.key === KEY) { cart = load(); drawCart(); }
      });

      drawCart();
    })();
  </script>
